<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Pi HDMI Display</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      background: #000000;
      overflow: hidden;
      cursor: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      /* Change to 'cover' if you want edge-to-edge cropping */
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <img id="stage" class="hidden" alt="" />

  <script>
    const socket = io();
    const stage = document.getElementById('stage');

    socket.on('stateUpdate', (state) => {
      const activeUrl = state.activeSlot ? state.slots[state.activeSlot] : null;
      if (!state.monitorOn || !activeUrl) {
        stage.classList.add('hidden');
        stage.removeAttribute('src');
        return;
      }

      if (stage.getAttribute('src') !== activeUrl) {
        stage.src = activeUrl;
      }
      stage.classList.remove('hidden');
    });
  </script>
</body>

</html>
