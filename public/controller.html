<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Display Controller</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111827;
      color: #f9fafb;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #1f2937;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: 16px 0 6px; font-size: 0.9rem; color: #d1d5db; }
    textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #111827;
      color: #f9fafb;
      font-size: 1rem;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .status {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #9ca3af;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pi Display Controller</h1>

    <label for="textInput">Display Text</label>
    <textarea id="textInput" rows="3" placeholder="Enter message to show on display..."></textarea>
    <button id="sendTextBtn">Show Text</button>

    <label for="mediaInput">Upload Image or Video</label>
    <input id="mediaInput" type="file" accept="image/*,video/*" />
    <button id="uploadBtn">Upload &amp; Show Media</button>

    <div class="status" id="status">Loading state...</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const textInput = document.getElementById('textInput');
    const mediaInput = document.getElementById('mediaInput');

    function renderStatus(state) {
      statusEl.textContent = `Current mode: ${state.mode} | Updated: ${state.updatedAt || 'never'}`;
    }

    fetch('/api/state')
      .then((r) => r.json())
      .then((state) => {
        if (state.text) textInput.value = state.text;
        renderStatus(state);
      });

    document.getElementById('sendTextBtn').addEventListener('click', async () => {
      const res = await fetch('/api/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: textInput.value })
      });
      renderStatus(await res.json());
    });

    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const file = mediaInput.files[0];
      if (!file) return alert('Select an image or video first.');
      const form = new FormData();
      form.append('media', file);
      const res = await fetch('/api/upload', { method: 'POST', body: form });
      renderStatus(await res.json());
    });
  </script>
</body>
</html>
